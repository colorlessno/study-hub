name: StudySecurity representative tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  representative-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        theme:
          - security03_rbac
          - security05_input_validation
          - security11_webhook_signature
          - security21_ai_content_moderation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Test ${{ matrix.theme }}
        run: npm --prefix category/StudySecurity/src/backend/src/studysecurity/systems/${{ matrix.theme }} test
