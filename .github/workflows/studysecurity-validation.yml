name: StudySecurity representative tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  representative-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        theme:
          - security03_rbac
          - security05_input_validation
          - security11_webhook_signature
          - security21_ai_content_moderation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Test ${{ matrix.theme }}
        run: npm --prefix category/StudySecurity/src/backend/src/studysecurity/systems/${{ matrix.theme }} test
