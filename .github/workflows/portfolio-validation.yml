name: Portfolio validation

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: repository-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-documents:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Validate sequential workflow configuration
        run: node scripts/validate-workflow-sequential.mjs

      - name: Validate maintained Node.js runtime configuration
        run: node scripts/validate-node-runtime-baseline.mjs

      - name: Validate pinned Docker image references
        run: node scripts/validate-docker-image-lock.mjs

      - name: Install StudyHub dependencies
        run: npm ci
        working-directory: app

      - name: Build StudyHub
        run: npm run build
        working-directory: app

      - name: Test StudyHub
        run: npm test
        working-directory: app

      - name: Validate UTF-8, links, and learning catalog
        shell: pwsh
        run: ./scripts/validate_portfolio.ps1

      - name: Validate field contracts
        run: node scripts/validate-study-catalog.mjs

  validate-studybase:
    needs: validate-documents
    uses: ./.github/workflows/studybase-validation.yml

  validate-studyweb:
    needs: validate-studybase
    uses: ./.github/workflows/studyweb-validation.yml

  validate-studysecurity:
    needs: validate-studyweb
    uses: ./.github/workflows/studysecurity-validation.yml

  validate-studydevops:
    needs: validate-studysecurity
    uses: ./.github/workflows/studydevops-ci.yml

  validate-studyaws:
    needs: validate-studydevops
    uses: ./.github/workflows/studyaws-validation.yml

  validate-studydb:
    needs: validate-studyaws
    uses: ./.github/workflows/studydb-validation.yml

  validate-studydesktop:
    needs: validate-studydb
    uses: ./.github/workflows/studydesktop-validation.yml

  validate-studyarchitecture:
    needs: validate-studydesktop
    uses: ./.github/workflows/studyarchitecture-validation.yml

  validate-studyapi:
    needs: validate-studyarchitecture
    uses: ./.github/workflows/studyapi-validation.yml

  validate-study-ai-idea-generation:
    needs: validate-studyapi
    uses: ./.github/workflows/study-ai-idea-generation-validation.yml

  validate-study-ai-corporate-employee:
    needs: validate-study-ai-idea-generation
    uses: ./.github/workflows/study-ai-corporate-employee-validation.yml

  validate-ideaforge:
    needs: validate-study-ai-corporate-employee
    uses: ./.github/workflows/ideaforge-validation.yml

  validate-studyai-learning:
    needs: validate-ideaforge
    uses: ./.github/workflows/studyai-learning-validation.yml
