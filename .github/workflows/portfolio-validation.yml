name: Portfolio validation

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-documents:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install StudyHub dependencies
        run: npm ci
        working-directory: app

      - name: Build StudyHub
        run: npm run build
        working-directory: app

      - name: Test StudyHub
        run: npm test
        working-directory: app

      - name: Validate UTF-8, links, and learning catalog
        shell: pwsh
        run: ./scripts/validate_portfolio.ps1

      - name: Validate field contracts
        run: node scripts/validate-study-catalog.mjs
