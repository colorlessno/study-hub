name: IdeaForge validation

on:
  push:
    paths:
      - "category/StudyIdeaForge/**"
      - ".github/workflows/ideaforge-validation.yml"
  pull_request:
    paths:
      - "category/StudyIdeaForge/**"
      - ".github/workflows/ideaforge-validation.yml"

permissions:
  contents: read

concurrency:
  group: ideaforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-no-ai-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test isolated SQLite storage
        run: python -m unittest discover -s category/StudyIdeaForge/ideaforge/backend/tests -v
