name: IdeaForge validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-no-ai-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test isolated SQLite storage
        run: python -m unittest discover -s category/StudyIdeaForge/ideaforge/backend/tests -v
