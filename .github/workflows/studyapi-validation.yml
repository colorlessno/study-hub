name: StudyAPI validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-http-boundaries:
    name: Validate HTTP boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Run standard-library tests
        run: python -m unittest discover -s category/StudyAPI/tests -p "test_*.py"
