name: StudyAIIdeaGeneration validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-prompts:
    name: Validate prompt learning assets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate inputs and prompt structure
        run: python category/StudyAIIdeaGeneration/verify/verify_prompts.py --check-only
      - name: Validate comparison inputs
        run: |
          python category/StudyAIIdeaGeneration/verify/verify_prompts.py --check-only --input category/StudyAIIdeaGeneration/exercise/baseline_input.json
          python category/StudyAIIdeaGeneration/verify/verify_prompts.py --check-only --input category/StudyAIIdeaGeneration/exercise/variant_input.json
      - name: Run standard-library tests
        run: python -m unittest discover -s category/StudyAIIdeaGeneration/verify -p "test_*.py"
