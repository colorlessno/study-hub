name: StudyWeb representative tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  representative-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - theme: web28_env_config
            path: category/StudyWeb/src/backend/src/studyweb/systems/web28_env_config/backend
          - theme: web33_cookie_session
            path: category/StudyWeb/src/backend/src/studyweb/systems/web33_cookie_session
          - theme: web42_pagination_sort_filter_api
            path: category/StudyWeb/src/backend/src/studyweb/systems/web42_pagination_sort_filter_api
          - theme: web43_idempotency_key
            path: category/StudyWeb/src/backend/src/studyweb/systems/web43_idempotency_key
          - theme: web48_job_status_api
            path: category/StudyWeb/src/backend/src/studyweb/systems/web48_job_status_api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test ${{ matrix.theme }}
        run: npm --prefix "${{ matrix.path }}" test
