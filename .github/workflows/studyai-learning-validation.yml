name: StudyAI learning validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-ai-learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: category/StudyAI/src/backend/pyproject.toml

      - name: Install StudyAI backend and test dependencies
        run: python -m pip install -e ".[dev]"
        working-directory: category/StudyAI/src/backend

      - name: Run StudyAI backend tests
        run: python -m pytest -p asyncio -q
        working-directory: category/StudyAI/src/backend
        env:
          ALLOW_DEMO_HEADER_AUTH: "true"

      - name: Run AI learning validation
        run: python category/StudyAI/scripts/validate-ai-learning.py

      - name: Run dependency-free system03 RAG validation
        run: python category/StudyAI/scripts/validate-system03-rag-learning.py

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: category/StudyAI/src/frontend/package-lock.json

      - name: Install StudyAI frontend dependencies
        run: npm ci
        working-directory: category/StudyAI/src/frontend

      - name: Build StudyAI frontend
        run: npm run build
        working-directory: category/StudyAI/src/frontend
