name: StudyAI learning validation

on:
  push:
    paths:
      - "category/StudyAI/**"
      - ".github/workflows/studyai-learning-validation.yml"
  pull_request:
    paths:
      - "category/StudyAI/**"
      - ".github/workflows/studyai-learning-validation.yml"

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-ai-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI learning validation dependencies
        run: >-
          python -m pip install
          "Pillow>=11.2.1,<12.0.0"
          "httpx>=0.28.1,<1.0.0"
          "pydantic-settings>=2.10.0,<3.0.0"

      - name: Install StudyAI backend and test dependencies
        run: python -m pip install -e ".[dev]"
        working-directory: category/StudyAI/src/backend

      - name: Run StudyAI backend tests
        run: python -m pytest -p asyncio -q
        working-directory: category/StudyAI/src/backend
        env:
          ALLOW_DEMO_HEADER_AUTH: "true"

      - name: Run AI learning validation
        run: python category/StudyAI/scripts/validate-ai-learning.py

      - name: Run dependency-free system03 RAG validation
        run: python category/StudyAI/scripts/validate-system03-rag-learning.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: category/StudyAI/src/frontend/package-lock.json

      - name: Install StudyAI frontend dependencies
        run: npm ci
        working-directory: category/StudyAI/src/frontend

      - name: Build StudyAI frontend
        run: npm run build
        working-directory: category/StudyAI/src/frontend
