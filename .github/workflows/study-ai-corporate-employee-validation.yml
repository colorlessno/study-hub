name: StudyAICorporateEmployee validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-role-boundaries:
    name: Validate role boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate profiles and cases
        run: python category/StudyAICorporateEmployee/exercise/scripts/validate_profiles.py
      - name: Run standard-library tests
        run: python -m unittest discover -s category/StudyAICorporateEmployee/exercise/scripts -p "test_*.py"
