name: StudyBase validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-foundations:
    name: Validate foundation lessons
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Run isolated StudyBase validation
        run: node category/StudyBase/scripts/validate-studybase.mjs
