name: StudyBase validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-foundations:
    name: Validate foundation lessons
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run isolated StudyBase validation
        run: node category/StudyBase/scripts/validate-studybase.mjs
