name: StudyDB validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-postgresql-lessons:
    name: Validate PostgreSQL lessons
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run isolated StudyDB validation
        run: node category/StudyDB/scripts/validate-studydb.mjs
