name: StudyDB validation

on:
  push:
    paths:
      - "category/StudyDB/**"
      - ".github/workflows/studydb-validation.yml"
  pull_request:
    paths:
      - "category/StudyDB/**"
      - ".github/workflows/studydb-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studydb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-postgresql-lessons:
    name: Validate PostgreSQL lessons
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run isolated StudyDB validation
        run: node category/StudyDB/scripts/validate-studydb.mjs
