name: StudyArchitecture validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-learning-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate architecture learning artifacts
        run: python category/StudyArchitecture/scripts/validate-architecture-learning.py
