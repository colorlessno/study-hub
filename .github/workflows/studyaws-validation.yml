name: StudyAWS validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-local-lessons:
    name: Validate local cloud lessons
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Run StudyAWS validation without AWS credentials
        run: node category/StudyAWS/scripts/validate-studyaws.mjs
