name: StudyAWS validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-local-lessons:
    name: Validate local cloud lessons
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run StudyAWS validation without AWS credentials
        run: node category/StudyAWS/scripts/validate-studyaws.mjs
