name: StudyDesktop validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-electron-boundaries:
    name: Validate Electron learning boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: category/StudyDesktop/src/apps/desktop01_electron_local_environment_automation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run GUI-free validation
        run: npm run verify
