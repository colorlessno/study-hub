name: StudyDesktop validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-electron-boundaries:
    name: Validate Electron learning boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: category/StudyDesktop/src/apps/desktop01_electron_local_environment_automation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Run GUI-free validation
        run: npm run verify
