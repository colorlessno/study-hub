name: StudyDesktop validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-electron-boundaries:
    name: Validate Electron learning boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: category/StudyDesktop/src/apps/desktop01_electron_local_environment_automation
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run GUI-free validation
        run: npm run verify
