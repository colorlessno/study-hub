services:
  app-ok:
    build: .
    ports:
      - "18088:8080"
    environment:
      APP_MODE: ok
  app-missing-env:
    build: .
    environment:
      APP_MODE: missing-env
    restart: "no"
  app-runtime-error:
    build: .
    ports:
      - "18089:8080"
    environment:
      APP_MODE: runtime-error
