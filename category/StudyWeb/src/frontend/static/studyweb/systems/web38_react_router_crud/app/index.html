<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>web38 React Router CRUD</title>
  <style>
    body{font-family:sans-serif;line-height:1.6;max-width:760px;margin:32px auto;padding:0 16px;color:#222}
    nav,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0}
    a{color:#075da7}button,input{font:inherit}button{padding:7px 16px;cursor:pointer}
    .current-route{background:#f3f3f3;border:1px solid #bbb;padding:8px}
    main{border:1px solid #bbb;padding:20px;min-height:220px}.item-list{padding:0;list-style:none}
    .item-list li{display:flex;gap:14px;align-items:center;border-bottom:1px solid #ddd;padding:10px 0}
    .item-list strong{min-width:180px}label{display:grid;gap:6px;max-width:440px}input{padding:8px}
    dl{display:grid;grid-template-columns:80px 1fr}dt,dd{padding:6px;margin:0;border-bottom:1px solid #ddd}
  </style>
</head>
<body><div id="app"></div><script src="bundle/main.js"></script></body>
</html>
