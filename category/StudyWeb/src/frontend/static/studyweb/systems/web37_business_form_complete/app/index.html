<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>web37 業務用入力フォーム</title>
  <style>
    body{font-family:sans-serif;line-height:1.6;max-width:720px;margin:32px auto;padding:0 16px;color:#222}
    form,section{border:1px solid #bbb;padding:20px;margin:18px 0}label{display:grid;gap:6px;margin:14px 0}
    input,textarea,select,button{font:inherit}input,textarea,select{padding:8px}textarea{min-height:90px}
    button{padding:8px 18px;margin-right:10px}.field-error,.form-error{color:#a11}.field-error{min-height:1.5em}
    [aria-invalid="true"]{border:2px solid #a11}.form-error{border:1px solid #a11;background:#fff6f6;padding:10px}
    dl{display:grid;grid-template-columns:120px 1fr}dt,dd{padding:7px;margin:0;border-bottom:1px solid #ddd}
    pre{white-space:pre-wrap;background:#f5f5f5;padding:12px;min-height:1.5em}
  </style>
</head>
<body>
  <main>
    <h1>業務用入力フォーム</h1>
    <p>入力検証、内容確認、送信中、成功、送信失敗を順に確認できます。</p>
    <p id="form-error" class="form-error" role="alert" tabindex="-1" hidden></p>

    <form id="form" novalidate>
      <label for="customer">顧客名（必須）
        <input id="customer" autocomplete="organization" aria-describedby="e_customer">
      </label>
      <span id="e_customer" class="field-error" role="alert"></span>

      <label for="email">メール（必須）
        <input id="email" type="email" autocomplete="email" aria-describedby="e_email">
      </label>
      <span id="e_email" class="field-error" role="alert"></span>

      <label for="note">備考（200文字以内）
        <textarea id="note" aria-describedby="e_note"></textarea>
      </label>
      <span id="e_note" class="field-error" role="alert"></span>

      <label for="expected-result">確認する送信結果
        <select id="expected-result">
          <option value="success">成功</option>
          <option value="failure">送信失敗</option>
        </select>
      </label>
      <button id="confirm" type="submit">入力内容を確認</button>
    </form>

    <section id="confirmation" aria-labelledby="confirmation-title" hidden>
      <h2 id="confirmation-title">入力内容の確認</h2>
      <dl>
        <dt>顧客名</dt><dd id="confirm-customer"></dd>
        <dt>メール</dt><dd id="confirm-email"></dd>
        <dt>備考</dt><dd id="confirm-note"></dd>
        <dt>送信結果</dt><dd id="confirm-result"></dd>
      </dl>
      <button id="submit" type="button">送信する</button>
      <button id="edit" type="button">入力を修正</button>
    </section>

    <section id="success" aria-labelledby="success-title" hidden>
      <h2 id="success-title">送信が完了しました</h2>
      <p>入力内容を受け付けました。</p>
      <button id="restart" type="button">別の内容を入力</button>
    </section>

    <pre id="out" role="status" aria-live="polite"></pre>
  </main>
  <script src="src/main.js"></script>
</body>
</html>
