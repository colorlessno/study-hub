<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>web47 PDFファイル選択時の検証</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main>
    <h1>PDFファイル選択時の検証</h1>
    <p>ファイル名の拡張子、ブラウザが通知した種類、容量を別々に確認します。</p>
    <p class="notice">この画面はファイルをサーバーへ送信または保存しません。</p>

    <section aria-labelledby="sample-heading">
      <h2 id="sample-heading">用意された確認データ</h2>
      <p>ファイルを準備しなくても、3種類の判定を同じ条件で再現できます。</p>
      <div class="sample-buttons">
        <button type="button" data-sample="valid">小さいPDF</button>
        <button type="button" data-sample="invalid-type">PDF以外</button>
        <button type="button" data-sample="too-large">容量超過PDF</button>
      </div>
    </section>

    <section aria-labelledby="file-heading">
      <h2 id="file-heading">自分のファイルを確認</h2>
      <label for="file">確認するPDF</label>
      <input id="file" type="file" accept="application/pdf">
    </section>

    <section id="result" class="result" aria-labelledby="result-heading" aria-live="polite">
      <div class="result-header">
        <h2 id="result-heading">検証結果</h2>
        <button id="reset" type="button">結果をリセット</button>
      </div>
      <p id="result-status">確認データのボタンを押すか、PDFを選んでください。</p>
      <dl>
        <div><dt>ファイル名</dt><dd id="result-name">未選択</dd></div>
        <div><dt>容量</dt><dd id="result-size">未選択</dd></div>
        <div><dt>ファイルの種類</dt><dd id="result-type">未選択</dd></div>
      </dl>
      <ul id="result-errors" class="errors" hidden></ul>
    </section>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
