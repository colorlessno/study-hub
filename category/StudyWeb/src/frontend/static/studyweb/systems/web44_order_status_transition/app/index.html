<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>web44 注文状態の遷移</title>
</head>
<body>
  <main>
    <h1>注文状態の遷移</h1>
    <p>現在の状態から許可されている変更だけを実行します。</p>

    <section aria-labelledby="operation-heading">
      <h2 id="operation-heading">状態を変更する</h2>
      <label for="next">変更先</label>
      <select id="next">
        <option value="confirmed">確認済み</option>
        <option value="shipped">発送済み</option>
        <option value="completed">完了</option>
        <option value="canceled">取消</option>
        <option value="draft">下書き</option>
      </select>
      <button id="go" type="button">状態を変更</button>
      <button id="reset" type="button">初期状態に戻す</button>
    </section>

    <section aria-labelledby="result-heading">
      <h2 id="result-heading">現在の注文</h2>
      <p id="message" role="status">初期状態です。</p>
      <dl>
        <dt>現在の状態</dt>
        <dd id="currentStatus"></dd>
        <dt>変更履歴</dt>
        <dd id="history"></dd>
      </dl>
    </section>
  </main>
  <script src="src/main.js"></script>
</body>
</html>
