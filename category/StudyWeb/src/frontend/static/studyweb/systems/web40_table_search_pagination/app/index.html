<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>web40 一覧の検索・並べ替え・ページ分割</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main>
    <h1>一覧の検索・並べ替え・ページ分割</h1>
    <p>検索、並べ替え、絞り込み、ページ移動を組み合わせて一覧の状態を確認します。</p>

    <section class="controls" aria-label="一覧の操作">
      <label for="q">名前で検索</label>
      <input id="q" type="search" placeholder="例: Item B">

      <label for="status">対応状況</label>
      <select id="status">
        <option value="all">すべて</option>
        <option value="open">対応中</option>
        <option value="closed">完了</option>
      </select>

      <span>名前の並べ替え</span>
      <button id="toggle" type="button" aria-pressed="false">名前順: 昇順</button>

      <label for="display-state">確認する表示状態</label>
      <select id="display-state">
        <option value="success">通常表示</option>
        <option value="loading">読込中</option>
        <option value="error">読込エラー</option>
      </select>
    </section>

    <p id="info" class="info" aria-live="polite"></p>

    <table id="results-table" aria-label="項目一覧">
      <thead>
        <tr>
          <th scope="col">番号</th>
          <th scope="col">名前</th>
          <th scope="col">対応状況</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <nav class="pagination" aria-label="ページ移動">
      <button id="prev" type="button">前のページ</button>
      <button id="next" type="button">次のページ</button>
    </nav>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
