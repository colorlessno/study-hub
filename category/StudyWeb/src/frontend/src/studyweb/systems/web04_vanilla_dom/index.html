<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web04 JavaScriptによる画面操作</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main class="tool">
      <p class="sample-label">web04</p>
      <h1>JavaScriptによる画面操作</h1>
      <p>要素を取得し、イベントを登録し、画面表示を変更する流れを確認します。</p>

      <section class="panel" aria-labelledby="operationTitle">
        <h2 id="operationTitle">操作</h2>
        <div class="button-row">
          <button id="changeButton" type="button">表示を変える</button>
          <button id="resetButton" type="button">リセット</button>
        </div>
        <div id="resultText" class="result-box" aria-live="polite">
          初期メッセージです。ボタンを押すとJavaScriptで表示が変わります。
        </div>
      </section>
    </main>
  </body>
</html>
