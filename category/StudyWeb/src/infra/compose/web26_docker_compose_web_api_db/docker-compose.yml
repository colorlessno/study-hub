services:
  # Use --env-file ../../env/web26_docker_compose_web_api_db/.env.example for local sample values if needed.
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-web26}
    ports:
      - "${DB_PORT:-15426}:5432"
    volumes:
      - web26_db:/var/lib/postgresql/data
      - ../../db/web26_docker_compose_web_api_db/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d web26"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ../../../backend/src/studyweb/systems/web26_docker_compose_web_api_db/backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/web26}
    ports:
      - "${API_PORT:-13026}:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../../../frontend/src/studyweb/systems/web26_docker_compose_web_api_db/frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:13026}
    ports:
      - "${WEB_PORT:-5186}:5173"
    depends_on:
      - api

volumes:
  web26_db:

