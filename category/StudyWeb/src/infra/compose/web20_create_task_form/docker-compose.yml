services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-web20}
    ports:
      - "15420:5432"
    volumes:
      - web20_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d web20"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../../../backend/src/studyweb/systems/web20_create_task_form/backend
    command: npm run start:dev
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/web20?schema=public}
    ports:
      - "13020:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../../backend/src/studyweb/systems/web20_create_task_form/backend:/app
      - /app/node_modules

  migrate:
    build: ../../../backend/src/studyweb/systems/web20_create_task_form/backend
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/web20?schema=public}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../../backend/src/studyweb/systems/web20_create_task_form/backend:/app
      - /app/node_modules

  frontend:
    build: ../../../frontend/src/studyweb/systems/web20_create_task_form/frontend
    environment:
      VITE_API_URL: http://localhost:13020
    ports:
      - "5180:5173"
    depends_on:
      - backend

volumes:
  web20_db:

