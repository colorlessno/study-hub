<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>電子書籍セクション別自動要約</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <h1>電子書籍セクション別自動要約</h1>
    <p>既存のbook_summarization_cliへ実際の処理を依頼し、ジョブ状態と保存済み成果物を確認します。</p>

    <section>
      <h2>実行環境</h2>
      <pre id="health">確認中</pre>
    </section>

    <section>
      <h2>ジョブを開始</h2>
      <form id="job-form">
        <label>入力種別
          <select name="input_type">
            <option value="image_dir">画像フォルダー</option>
            <option value="pdf">PDF</option>
            <option value="capture">電子書籍リーダーの画面キャプチャ</option>
          </select>
        </label>
        <label>入力パス
          <input name="input_path" type="text" placeholder="C:\books\sample_pages または C:\books\sample.pdf">
        </label>
        <label>書籍ID
          <input name="book_id" type="text" value="studyhub_book_001" required>
        </label>
        <label>最大ページ数
          <input name="max_pages" type="number" value="500" min="1" max="5000">
        </label>
        <label class="check"><input name="resume" type="checkbox" checked> 完了済み処理を再利用する</label>
        <label class="check"><input name="enable_visual_extraction" type="checkbox" checked> 図表の抽出と説明を実行する</label>
        <label class="check"><input name="rights_confirmed" type="checkbox" required> 著作権フリーまたは利用許諾済みの書籍であることを確認した</label>
        <button type="submit">ジョブを開始</button>
      </form>
      <p id="form-message" role="status"></p>
    </section>

    <section>
      <div class="heading-row">
        <h2>ジョブ一覧</h2>
        <button id="refresh" type="button">一覧を更新</button>
      </div>
      <div id="jobs"></div>
    </section>

    <section>
      <h2>選択したジョブ</h2>
      <pre id="job-detail">ジョブを選択してください。</pre>
      <div class="heading-row">
        <button id="show-sections" type="button" disabled>セクションを表示</button>
        <button id="show-artifacts" type="button" disabled>成果物を表示</button>
      </div>
      <pre id="result-detail">結果はここに表示されます。</pre>
    </section>
  </main>
  <script type="module" src="/main.js"></script>
</body>
</html>
