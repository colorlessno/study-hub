services:
  db:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    environment:
      POSTGRES_DB: system47
      POSTGRES_USER: system47
      POSTGRES_PASSWORD: system47-local-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U system47 -d system47"]
      interval: 2s
      timeout: 3s
      retries: 30
