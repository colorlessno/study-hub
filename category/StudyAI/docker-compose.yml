services:
  db:
    image: pgvector/pgvector:pg16
    container_name: studyai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studyai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - studyai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studyai"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: studyai-migrate
    working_dir: /app/backend
    env_file:
      - src/backend/.env.docker
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: studyai-backend
    working_dir: /app/backend
    env_file:
      - src/backend/.env.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ./src/backend/data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      [
        "uvicorn",
        "studyai.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: studyai-frontend
    working_dir: /app/frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:15173:5173"
    environment:
      TZ: Asia/Tokyo
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_DEMO_USER_ID: ${STUDYAI_DEMO_USER_ID:-user01}
      VITE_DEMO_USER_ROLES: ${STUDYAI_DEMO_USER_ROLES:-admin}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    restart: unless-stopped

  backend-test:
    build:
      context: .
      dockerfile: src/backend/Dockerfile.test
    container_name: studyai-backend-test
    working_dir: /app/backend
    env_file:
      - src/backend/.env.docker
    environment:
      PYTHONPATH: /app/backend/src
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "pytest", "-p", "asyncio", "-q", "tests/systems/test_ai_learning_systems.py", "tests/systems/test_enterprise_ai_systems.py"]
    restart: "no"

  system02:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: studyai-system02
    working_dir: /app/backend
    env_file:
      - src/backend/.env.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
