<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>security07 CSRF対策</title>
  <style>
    body { margin: 0; padding: 24px; color: #202124; font-family: sans-serif; background: #f5f7f8; }
    main { max-width: 820px; margin: 0 auto; padding: 24px; border: 1px solid #b8bec3; background: #fff; }
    .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
    button { padding: 10px; border: 1px solid #44515a; border-radius: 6px; background: #fff; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .6; }
    pre { min-height: 140px; padding: 14px; border: 1px solid #c7ccd0; white-space: pre-wrap; background: #f7f7f7; }
    .note { padding: 12px; border-left: 4px solid #4c6c8c; background: #eef4f8; }
  </style>
</head>
<body>
  <main>
    <p>security07</p>
    <h1>CSRF対策の安全なローカル比較</h1>
    <p class="note">攻撃ページ風の操作を同一originで安全に模擬します。Cookieは自動送信されますが、CSRF tokenがない状態変更はAPIが拒否します。SameSiteは補助対策であり、token検証の代わりにはなりません。</p>
    <div class="actions">
      <button data-action="reset" type="button">状態とCookieを初期化</button>
      <button data-action="issue" type="button">Cookieとtokenを発行</button>
      <button data-action="attack" type="button">攻撃ページ風にtokenなしで送信</button>
      <button data-action="protected" type="button">発行tokenで保護された送信</button>
      <button data-action="replay" type="button">同じtokenを再送</button>
    </div>
    <h2>API応答</h2>
    <pre id="result">操作を選んでください。</pre>
  </main>
  <script>
    let csrfToken = "";
    let busy = false;
    const buttons = [...document.querySelectorAll("button[data-action]")];
    const result = document.getElementById("result");

    async function request(path, options = {}) {
      if (busy) return;
      busy = true;
      buttons.forEach((button) => { button.disabled = true; });
      try {
        const response = await fetch(path, {
          credentials: "same-origin",
          ...options,
          headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        });
        const body = await response.json();
        if (path === "/token" && response.ok) csrfToken = body.token;
        if (path === "/demo/reset") csrfToken = "";
        result.textContent = JSON.stringify({ status: response.status, body }, null, 2);
      } catch (error) {
        result.textContent = JSON.stringify({ error: String(error) }, null, 2);
      } finally {
        busy = false;
        buttons.forEach((button) => { button.disabled = false; });
      }
    }

    document.querySelector('[data-action="reset"]').addEventListener("click", () => request("/demo/reset", { method: "POST", body: "{}" }));
    document.querySelector('[data-action="issue"]').addEventListener("click", () => request("/token"));
    document.querySelector('[data-action="attack"]').addEventListener("click", () => request("/transfer", { method: "POST", body: "{}" }));
    document.querySelector('[data-action="protected"]').addEventListener("click", () => request("/transfer", { method: "POST", body: JSON.stringify({ csrf: csrfToken }) }));
    document.querySelector('[data-action="replay"]').addEventListener("click", () => request("/transfer", { method: "POST", body: JSON.stringify({ csrf: csrfToken }) }));
  </script>
</body>
</html>
