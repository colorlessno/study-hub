<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>security03 RBAC比較</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; color: #1f2937; background: #f8fafc; }
      main { max-width: 760px; margin: 0 auto; padding: 24px; background: #fff; border: 1px solid #cbd5e1; }
      label { display: grid; gap: 8px; margin-bottom: 16px; }
      select, button { min-height: 40px; padding: 8px 12px; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
      .warning { padding: 12px; border-left: 4px solid #d97706; background: #fffbeb; }
      pre { min-height: 120px; padding: 12px; overflow: auto; background: #111827; color: #f9fafb; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <p>security03</p>
      <h1>RBACのUI表示制御とAPI認可</h1>
      <p>画面はroleに応じて通常の取消ボタンを隠しますが、APIは画面表示に関係なく毎回permissionを検証します。</p>

      <label>
        学習用ユーザー
        <select id="user">
          <option value="v-viewer">viewer（閲覧のみ）</option>
          <option value="o-operator">operator（閲覧・取消）</option>
          <option value="a-admin">admin（閲覧・取消）</option>
        </select>
      </label>

      <p id="ui-state" class="warning"></p>
      <div class="actions">
        <button id="read" type="button">注文を閲覧</button>
        <button id="cancel" type="button" hidden>画面に表示された取消ボタン</button>
        <button id="direct" type="button">APIへ取消要求を直接送信</button>
      </div>

      <h2>API応答</h2>
      <pre id="result">操作を選んでください。</pre>
    </main>
    <script>
      const userSelect = document.querySelector("#user");
      const cancelButton = document.querySelector("#cancel");
      const uiState = document.querySelector("#ui-state");
      const result = document.querySelector("#result");

      function updateVisibleActions() {
        const canCancel = userSelect.value !== "v-viewer";
        cancelButton.hidden = !canCancel;
        uiState.textContent = canCancel
          ? "UI表示: 取消ボタンを表示しています。"
          : "UI表示: viewerには通常の取消ボタンを表示しません。直接要求してもAPI側で403になります。";
      }

      async function callApi(method, url) {
        result.textContent = "通信中...";
        try {
          const response = await fetch(url, {
            method,
            headers: { "X-User": userSelect.value },
          });
          const body = await response.json();
          result.textContent = JSON.stringify({ status: response.status, body }, null, 2);
        } catch (error) {
          result.textContent = JSON.stringify({ error: "network_error" }, null, 2);
        }
      }

      userSelect.addEventListener("change", updateVisibleActions);
      document.querySelector("#read").addEventListener("click", () => callApi("GET", "/orders"));
      cancelButton.addEventListener("click", () => callApi("POST", "/orders/o-100/cancel"));
      document.querySelector("#direct").addEventListener("click", () => callApi("POST", "/orders/o-100/cancel"));
      updateVisibleActions();
    </script>
  </body>
</html>
