<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>security08 XSS対策</title>
  <style>
    body { margin: 0; padding: 24px; color: #202124; font-family: sans-serif; background: #f5f7f8; }
    main { max-width: 760px; margin: 0 auto; padding: 24px; border: 1px solid #b8bec3; background: #fff; }
    label, textarea { display: block; width: 100%; box-sizing: border-box; }
    textarea { min-height: 96px; margin: 8px 0 12px; padding: 8px; font: inherit; }
    button { padding: 8px 18px; border: 1px solid #44515a; border-radius: 6px; background: #fff; cursor: pointer; }
    section { margin-top: 24px; }
    pre { min-height: 48px; padding: 12px; border: 1px solid #c7ccd0; white-space: pre-wrap; background: #f7f7f7; }
  </style>
</head>
<body>
  <main>
    <h1>XSS対策：入力を文字として表示する</h1>
    <p>HTMLタグの形をした入力を、ブラウザにHTMLとして解釈させず表示します。</p>
    <label for="text">表示する文字</label>
    <textarea id="text"><b>sample</b></textarea>
    <button id="render" type="button">安全に表示</button>
    <section>
      <h2>安全な表示結果</h2>
      <pre id="safe">ボタンを押すと結果が表示されます。</pre>
    </section>
    <section>
      <h2>危険な処理との違い</h2>
      <pre id="danger">入力値をinnerHTMLへ設定すると、文字ではなくHTMLとして解釈されます。この教材では実行しません。</pre>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
