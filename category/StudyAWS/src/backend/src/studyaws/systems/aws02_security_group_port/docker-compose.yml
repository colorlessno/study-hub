services:
  web:
    image: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    working_dir: /app
    command: node web/server.js
    volumes:
      - ./:/app
    ports:
      - "127.0.0.1:${STUDYHUB_HOST_PORT:-43102}:4102"
    depends_on:
      - api
  api:
    image: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    working_dir: /app
    command: node api/server.js
    environment:
      DATABASE_URL: http://db:5432
    volumes:
      - ./:/app
    expose:
      - "5102"
    depends_on:
      - db
  db:
    image: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    working_dir: /app
    command: node db/server.js
    volumes:
      - ./:/app
    expose:
      - "5432"
